<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
    <title></title>
    <script src="js/mui.min.js"></script>
    <link href="css/mui.min.css" rel="stylesheet"/>
</head>
<body>
	<header class="mui-bar mui-bar-nav">
		<h1 class="mui-title">登录</h1>
	</header>
	<div class="mui-content">
		<br>
		<form class="mui-input-group" style="border-radius: 50px; width: 80%; position: absolute;left: 10%;">
			<div class="mui-input-row">
				<input id="username" type="text" class="mui-input-clear" placeholder="请输入">
			</div>
		</form>
		
	<br>	
	
	<form class="mui-input-group" style="border-radius: 50px; width: 80%; position: relative;left: 10%; top: 30px;">
		<div class="mui-input-row">
			<input id="password" type="password" class="mui-input-password" placeholder="请输入">
		</div>
	</form>
		
		<div id="but">
		<button id="butt" type="button" class="mui-btn mui-btn-blue" style="position: relative;top: 50px;left: 25%; width: 200px; height: 40px; border-radius: 50px;">按钮</button>
		</div>
		
		
	</div>
	<script src="js/http.js" type="text/javascript" charset="utf-8"></script>
    <script type="text/javascript" charset="utf-8">
      	mui.init();
		mui.plusReady(function () {

			mui('#but').on('tap','#butt',function(){

				var username = document.getElementById('username').value;
				var password = document.getElementById('password').value;

				if (username == '' || password == '') {
					mui.toast('账号/密码不能为空')
				} else{
					mui.ajax(http + '/api/login',{

						data:JSON.stringify({
							username:username,
							password:password
						}),
						headers:{
							'Content-Type':'application/json'
						},

						dataType:'json',
						type:'post',
						timeout:10000,
						success:function(data){

							if (data.code == 200) {
								console.log(data.code)

								mui.toast('欢迎' + username + '登陆成功')
								localStorage.setItem('token',data.token)
								mui.openWindow({
									url:'./exe/page.html'
								})

							}else{

								mui.toast(data.msg || '账号/密码错误')

							}

						},
						error:function(xhr,type,errorThrown){

							console.log('登录失败：', type, xhr.status)
						}
					});
				}

			})

		})
    </script>
</body>
</html>
