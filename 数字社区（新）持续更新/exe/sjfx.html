<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<h1 class="mui-title">数据分析</h1>
		</header>

		<div class="mui-content">
			<div id="TiaoXIngTu" style="height: 200px; width: 100%; "></div>
			<div id="ZeiXianTu" style="height: 200px; width: 100%;"></div>
			<div id="BingTu" style="height: 300px; width: 100%;"></div>
		</div>

		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/echarts.js"></script>
		<script type="text/javascript">
			mui.init()

			var TiaoXIng = echarts.init(document.getElementById('TiaoXIngTu'));
			var ZeiXian = echarts.init(document.getElementById('ZeiXianTu'));
			var Bing = echarts.init(document.getElementById('BingTu'));

			mui.ajax(http + '/api/data/comment/list_1', {
				data: {},
				headers: {
					'Authorization': localStorage.getItem('token')
				},
				dataType: 'json',
				type: 'get',
				timeout: 10000,
				success: function (data) {
					if (data.code == 200) {

						var d = data.data

						var lineOption = {
							color: ['#98f2ff', '#beffd1'],
							legend: {
								data: ['女性评论数统计', '男性评论数统计'],
								left: "center",
							},
							grid: {
								show: true
							},
							xAxis: {
								type: 'category',
								data: d.name,
								splitLine: { show: true },
							},
							yAxis: {
								type: 'value',
								min: 0,
							},

							series: [{
								name: '女性评论数统计',
								data: d.woman,
								type: 'bar'
							},
							{
								name: '男性评论数统计',
								data: d.man,
								type: 'bar'
							}
							]
						}
						TiaoXIng.setOption(lineOption)
					}
				},
				error: function (xhr, type, errorThrown) {

				}
			});

			mui.ajax(http + '/api/dataAnalysis/information/list_1', {
				data: {},
				headers: {
					'Authorization': localStorage.getItem('token')
				},
				dataType: 'json',
				type: 'GET',
				timeout: 10000,
				success: function (data) {
					if (data.code == 200) {

						var d = data.data

						var lineOption = {
							color: ["#ff4c9d"],
							legend: {
								data: ['每月用户购买快递数量'],
								left: 'center',
							},
							xAxis: {
								splitLine: {
									show: true
								},
								type: 'category',
								data: d.name
							},
							yAxis: {
								min: 0,
								type: 'value'
							},
							series: [{
								name: '每月用户购买快递数量',
								data: d.value,
								type: 'line'
							}]
						}
						ZeiXian.setOption(lineOption)
					}
				},
				error: function (xhr, type, errorThrown) {

				}
			});

			mui.ajax(http + '/api/dataAnalysis/activity/list_1', {
				data: {},
				headers: {
					'Authorization': localStorage.getItem('token')
				},
				dataType: 'json',
				type: 'GET',
				timeout: 10000,
				success: function (data) {

					if (data.code == 200) {

						var d = data.data;

						var pieData = [];
						var legendData = [];

						if (Array.isArray(d.name)) {
							for (var i = 0; i < d.name.length; i++) {
								pieData.push({
									name: d.name[i],
									value: d.count[i]
								});
								legendData.push(d.name[i]);
							}
						} else {

							pieData.push({
								name: d.name,
								value: d.count
							});
							legendData.push(d.name);
						}

						var pieOption = {
							color: ['#5470c6', '#73c0de', '#91cc75', '#fac858', '#fc8452', '#ee6666'],
							tooltip: {
								trigger: 'item'
							},
							legend: {
								bottom: '0',
								left: 'center',
								icon: 'circle',
								data: legendData
							},
							series: [{
								type: 'pie',
								radius: '35%',
								label: {
									show: true,
									formatter: '{b}: {d}%'
								},
								data: pieData
							}]
						}
						Bing.setOption(pieOption)
					}

				},
				error: function (xhr, type, errorThrown) {

				}
			});

		</script>
	</body>

</html>
