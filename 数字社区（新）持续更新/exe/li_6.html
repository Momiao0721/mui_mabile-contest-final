<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left"></a>
			<h1 class="mui-title">社区公告</h1>
		</header>
		<div class="mui-content">
			
			
			<div class="mui-slider">
				
				<div class="mui-slider-indicator mui-segmented-control mui-segmented-control-inverted" style="width: 70%; position: relative;left: 45px; background-color: #ffffff; border-radius: 50px;">
					<a class="mui-control-item mui-active" href="#item1">全部</a>
					<a class="mui-control-item" href="#item2">未读</a>
					<a class="mui-control-item" href="#item3">已读</a>
				</div>
				
				
				<div class="mui-slider-group">
					
					<div id="item1" class="mui-slider-item mui-control-content mui-active">
						<div id="QuanBu" style="padding: 10px; background-color: #efeff4;"></div>
					</div>
					
					<div id="item2" class="mui-slider-item mui-control-content">
						<div id="WeiDu" style="padding: 10px; background-color: #efeff4;"></div>
					</div>
					
					<div id="item3" class="mui-slider-item mui-control-content">
						<div id="YiDu" style="padding: 10px; background-color: #efeff4;"></div>
					</div>
					
				</div>
				
			</div>
			
			
		</div>
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				function loadNotice(params, targetId){

					mui.ajax(http + '/api/community/community_notice/list',{
						data:params,
						headers:{
							'Authorization':localStorage.getItem('token')
						},

						dataType:'json',
						type:'GET',
						timeout:10000,
						success:function(data){
							if (data.code != 200) return;

							var ListHTml = '';

							for (var i = 0 ; i < data.rows.length ; i++) {
								var r = data.rows[i];

								ListHTml += `<div style="border-radius: 20px; padding: 10px; background-color: #ffffff; margin-bottom: 10px; position: relative;">
									<p style="position: absolute; right: 5%; color: #C3040F;">${r.noticeStatus == 1 ? '已读' : '未读'}</p>
									<h4>${r.noticeTitle}</h4>
									<hr>
									<p style="color: #000000;">内容：${r.contentNotice}</p>
									<hr>
									<div style="position: relative; height: 24px;">
										<p style="color: #0062CC; position: absolute; right: 5%; margin: 0;" XiangQing="${r.id}">查看详情</p>
										<p style="color: #666666; margin: 0;">${r.createTime}</p>
									</div>
								</div>`;
							}

							if (ListHTml == '') {
								ListHTml = '<p style="text-align: center; color: #999999; padding: 20px;">暂无通知</p>';
							}

							document.getElementById(targetId).innerHTML = ListHTml;
						},
						error:function(xhr,type,errorThrown){
						}
					});

				}

				['QuanBu', 'WeiDu', 'YiDu'].forEach(function(id){
					mui('#' + id).on('tap', '[XiangQing]', function(){
						var noticeId = this.getAttribute('XiangQing');

						plus.storage.setItem('QuanBuID', noticeId);
						mui.openWindow({
							url: 'QuanBuHTML.html',
							id: 'QuanBuHTML',
							extras: {
								id: noticeId
							}
						});
					});
				});

				loadNotice({}, 'QuanBu');

				mui('.mui-segmented-control').on('tap', '.mui-control-item', function(){
					var href = this.getAttribute('href');

					if (href == '#item1') {
						loadNotice({}, 'QuanBu');
					} else if (href == '#item2') {
						loadNotice({ noticeStatus: 0 }, 'WeiDu');
					} else if (href == '#item3') {
						loadNotice({ noticeStatus: 1 }, 'YiDu');
					}
				});
			})
		</script>
	</body>

</html>
