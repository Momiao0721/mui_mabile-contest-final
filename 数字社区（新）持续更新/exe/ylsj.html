<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<p style="position: absolute; left: 45px; font-size: 20px; color: #000000;top: 8px;">友邻社交</p>
			<img src="../IMG/4bc0706dd1a65.jpg" style="position: relative;top: 3px; width: 30px; width: 30px;">
		</header>
		
		<div class="mui-content">
			
			
			<ul class="mui-table-view mui-grid-view" id="SeiJiao">
				
				
			
			</ul>
			
			
			
		</div>
		
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				function SeiJiao(){

				mui.ajax(http + '/api/community/friendly_neighborhood/list',{
					data:{

					},
					headers:{

						'Authorization':localStorage.getItem('token')
					},

					dataType:'json',
					type:'get',
					timeout:10000,
					success:function(data){

						if(data.code == 200){

							var  SeiJiaoHTML = '';
							for (var i = 0 ; i < data.rows.length ; i++) {

							SeiJiaoHTML += `<li TIaoZuanID="${data.rows[i].id}" class="mui-table-view-cell mui-media mui-col-xs-6 mui-col-sm-3">
					<a href="#">
						<img src="${httpimg + data.rows[i].imgUrl}" style="height: 200px; width: 100%;">
						<div class="mui-media-body" style="position: relative;">${data.rows[i].title}</div>
						<div style="font-size: 12px; color: #666666;">发布人：${data.rows[i].publishName}</div>
					</a>
					<div id="" style="height: 20px">
						<div id="" style="position: absolute;right: 0;">
							<h5>点赞的人类:${data.rows[i].likeNum}</h5>
						</div>
						<img src="${httpimg + data.rows[i].userImgUrl}" style="top: -15px; position: relative ;left: -70px; height: 20px; width: 20px;">
					</div>
				</li>`

				document.getElementById('SeiJiao').innerHTML = SeiJiaoHTML
							var XiangQingList = document.querySelectorAll('#SeiJiao .mui-media')

							for (var j = 0 ; j < XiangQingList.length ; j++) {

								(function(GengXing){
									GengXing.addEventListener('tap',function(){

										var id = this.getAttribute('TIaoZuanID')
										plus.storage.setItem('TIaoZuanID',id)

										mui.openWindow({
											url:'SeiJiaoXinagQing.html',
											id:'SeiJiaoXinagQing.html',

											extras:{
												id:id
											}
										})

									})
								})(XiangQingList[j])

							}

							}
						}
					},
					error:function(xhr,type,errorThrown){

					}
				});
				}
				SeiJiao()
			})
		</script>
	</body>

</html>
