<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav" style="height: 100px; background-color: #d9001b">
			<img src="../IMG/4bc0706dd1a65.jpg" style="top: 5px; position: absolute; height: 30px; width: 30px;">
			<h3 style="position: relative;left: 35px; top: 5px;">首页</h3>
			<div id="" style="position: relative;top: 10px;">
					<input type="text" class="mui-input-clear" placeholder="搜索动态">
			</div>
		</header>
		
		<div class="mui-content" style="position: relative;top: 50px;">
			
			
			<div id="" style="padding: 10px;">
				
				<div id="slider" class="mui-slider" >
				  <div class="mui-slider-group mui-slider-loop" id="lbt1"></div>
					
				
					
					
					
					
					
				  <div class="mui-slider-indicator" id="lbt2"></div>
					
				</div>
				
			</div>
			
			
			<div id="" style="padding: 10px;">
				<ul class="mui-table-view mui-grid-view mui-grid-9" id="jgg">
				
				
					</ul>
				
			</div>
			
			<div id="" style="padding: 5px;">
				<p style="position: absolute; left: 5%; color: #000000;">热点新闻</p>
				<p style="font-size: 30px; color: red;">|</p>
			</div>
			
			<div id="XingWen" style="padding: 10px;">
				
				
				
			</div>
			
			<div style="padding: 10px;">
			<button id="GengXing" type="button" class="mui-btn mui-btn-red mui-btn-block" style="border-radius: 10px;">更新</button>
			</div>
			
		</div>
		
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				function LBT(){

				mui.ajax(http + '/api/building/banner/list',{
					data:{

					},
					headers:{
						'Authorization':localStorage.getItem('token')
					},

					dataType:'json',
					type:'GET',
					timeout:10000,
					success:function(data){

						if (data.code == 200) {

							var lbtHTML = '';
							var lbtXia = '';

							lbtHTML += `<div class="mui-slider-item mui-slider-item-duplicate">
					  <a href="#">
						<img src="${httpimg + data.rows[data.rows.length-1].imgUrl}"  style=" height: 150px;">
					  </a>
					</div>`

							for (var i = 0 ; i< data.rows.length ; i++) {

								lbtHTML += `<div class="mui-slider-item">
					  <a href="#">
						<img src="${httpimg + data.rows[i].imgUrl}" style=" height: 150px;">
					  </a>
					</div>`
								lbtXia += `<div class="mui-indicator"></div>`
							}

							lbtHTML += `<div class="mui-slider-item mui-slider-item-duplicate">
					  <a href="#">
						<img src="${httpimg + data.rows[0].imgUrl}" style=" height: 150px;">
					  </a>
					</div>`

							document.getElementById('lbt1').innerHTML = lbtHTML;
							document.getElementById('lbt2').innerHTML = lbtXia;

						}

						mui('.mui-slider').slider({interval:3000})

					},
					error:function(xhr,type,errorThrown){

					}
				});

				}
				LBT()

				function JGG(){

					var JGGSUZHU = [{
						name:'党旗',
						id:'li_1',
					},
					{
						name:'党章',
						id:'li_2',
					},
					{
						name:'党徽',
						id:'li_3',
					},
					]
					var JGGHTML = '';
					for (var i = 0 ; i < JGGSUZHU.length ; i++) {

						JGGHTML += `<li class="mui-table-view-cell mui-media mui-col-xs-4 mui-col-sm-3">
					<a href="#" id="${JGGSUZHU[i].id}">
						<img src="../IMG/4bc0706dd1a65.jpg" style="border-radius: 30px; width: 50px; height: 50px;">
						<div class="mui-media-body">${JGGSUZHU[i].name}</div>
					</a>
				</li>`

					}

					document.getElementById('jgg').innerHTML = JGGHTML;
					document.getElementById('li_1').addEventListener('tap',function(){
						mui.openWindow('li_1.html')
					})

					document.getElementById('li_2').addEventListener('tap',function(){
						mui.openWindow('li_2.html')
					})

					document.getElementById('li_3').addEventListener('tap',function(){
						mui.openWindow('li_3.html')
					})

				}
				JGG()

				function XingWen(){

					mui.ajax(http + '/api/model/list',{
						data:{

						},
						headers:{
							'Authorization':localStorage.getItem('token')
						},

						dataType:'json',
						type:'get',
						timeout:10000,
						success:function(data){

							if (data.code == 200) {

								XingWenQuan = data.rows;
								XingWenWuTiao = 5
								GengXingXingWen()

							}

						},
						error:function(xhr,type,errorThrown){

						}
					});

					function GengXingXingWen(){

						if(XingWenWuTiao >= XingWenQuan.length){
							XingWenWuTiao = XingWenQuan.length
						}

						var XingWenHTML = '';

						for (var i = 0  ; i < XingWenWuTiao ; i++) {

							XingWenHTML += `<ul class="mui-table-view">

					<li class="mui-table-view-cell mui-media">
							<div class="mui-media-body">
								<h4 class="mui-ellipsis">${XingWenQuan[i].title}</h4>
								<h5 class="mui-ellipsis">${XingWenQuan[i].name}</h5>
								<p class="mui-ellipsis">${XingWenQuan[i].content}</p>
							</div>
					</li>

				</ul>
					<hr >`

						}

						document.getElementById('XingWen').innerHTML = XingWenHTML
					}

					document.getElementById('GengXing').addEventListener('tap',function(){
						XingWenWuTiao += 5;
						GengXingXingWen()
						if (XingWenWuTiao >= XingWenQuan.length) {
							this.innerHTML = '更新成功'
							this.setAttribute('disabled','disabled')
							this.classList.add('mui-disabled')
						}
					})

				}
				XingWen()
			})
		</script>
	</body>

</html>
