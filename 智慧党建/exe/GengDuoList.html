<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left"></a>
			<h1 class="mui-title">活动列表</h1>
		</header>
		
		<div class="mui-content">
			
			<div id="LIst">
				
			
			
			</div>
		</div>
		
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				mui.ajax(http + '/api/activity/list',{
					data:{

					},
					headers:{
						'Authorization':localStorage.getItem('token')
					},

					dataType:'json',
					type:'GET',
					timeout:10000,
					success:function(data){
						if(data.code == 200){

							var LIstJVSVS = '';

							for (var i = 0 ; i< data.rows.length ; i++) {

							LIstJVSVS += `<div id="" style="padding: 10px;">
				<div id="" style="background-color: #333333; border-radius: 10px; padding: 10px;">
					<img src="${httpimg + data.rows[i].imgUrl}" style="height: 200px; width: 100%;">
				<a href="javascript:;">
					 <div class="mui-media-body" style="color: #ffffff;">
						${data.rows[i].activityName}
						<p class="mui-ellipsis">${data.rows[i].activityDetail}</p>
					</div>
				</a>
				</div>
			</div>`
							}
							document.getElementById('LIst').innerHTML = LIstJVSVS;
						}
					},
					error:function(xhr,type,errorThrown){

					}
				});

			})
		</script>
	</body>

</html>
