<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left"></a>
			<h1 class="mui-title">修改密码</h1>
		</header>
		
		<div class="mui-content">
			
		<div class="mui-content" style="padding: 10px;">
					
					<p>旧密码</p>
					<input type="text" class="mui-input-clear" placeholder="请输入旧密码" id="username" style="border-radius: 10px;">
			
					<p>新密码</p>
					<input type="text" class="mui-input-clear" placeholder="请输入新密码" id="username" style="border-radius: 10px;">
			
					<p>再次输入</p>
					<input type="text" class="mui-input-clear" placeholder="再次输入密码" id="ZaiCi" style="border-radius: 10px;">
					
					<br>
					
					<div id="but" style="padding: 10px;">
					<button type="button" class="mui-btn mui-btn-red mui-btn-block" id="butt" style="border-radius: 20px;">确定</button>
					</div>
		</div>
		</div>
		
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				mui('#but').on('tap','#butt',function(){

					var username = document.getElementById('username').value;
					var password = document.getElementById('password').value;
					var ZaiCi = document.getElementById('ZaiCi').value;

					if(username == '' || password == '' || ZaiCi == ''){

						mui.toast('不能为空')

					}else{

						mui.ajax(http + '/api/login',{
							data:{
								username:username,
								password:password
							},
							headers:{
								'Content-Type':'application/json'
							},

							dataType:'json',
							type:'post',
							timeout:10000,
							success:function(data){

								if(data.code == 200){

									mui.toast('欢迎')
									localStorage.setItem('token',data.token)
									mui.openWindow({
										url:'./exe/page.html'
									})

								}else{

									mui.toast('密码错误')

								}

							},
							error:function(xhr,type,errorThrown){

							}
						});

					}

				})

			})
		</script>
	</body>
</html>
