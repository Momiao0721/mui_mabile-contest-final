<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left"></a>
			<h1 class="mui-title">详情</h1>
		</header>
		<div class="mui-content">
			
			<div id="XiangQing" style="padding: 5px;">
				
				
				<br>
				
				<div id="QingLuen">
					
			
				</div>
				
				<div id="">
					
					
					
				</div>
				
				
				
				
			</div>
			
		</div>
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				var extra = plus.webview.currentWebview().extra || {}
				var id = plus.storage.getItem('XiangQingID') || extra.id
				console.log(id)
				if(!id){
					console.log('wt')
					return;
				}

				function XiangQIng(){

						mui.ajax(http + '/api/community/friendly_neighborhood/' + id,{
							data:{

							},
							headers:{
								'Authorization':localStorage.getItem('token')
							},

							dataType:'json',
							type:'GET',
							timeout:10000,
							success:function(data){

								if (data.code == 200) {

									var XiangQingHTML = '';
									XiangQingHTML += `<div style="border-radius: 15px; padding: 5px; background-color: #C8C7CC;">

				<img src="${httpimg + data.data.imgUrl}" style="height: 200px; width: 100%;">

				<div id="">
					<h4>发布人:${data.data.publishName}</h4>
					<h5>${data.data.publishTime}</h5>
					<h5>${data.data.publishContent}</h5>
				</div>

				</div>`
									document.getElementById('XiangQing').innerHTML = XiangQingHTML
								}
							},
							error:function(xhr,type,errorThrown){

							}
						});

				}
				XiangQIng()

			})
		</script>
	</body>

</html>
