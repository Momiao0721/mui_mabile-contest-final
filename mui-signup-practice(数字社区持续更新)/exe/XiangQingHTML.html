<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>
<style type="text/css">
	*{
		/* overflow: hidden; */
	}
</style>
	<body>
		<header class="mui-bar mui-bar-nav">
			<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left"></a>
			<h1 class="mui-title">详情</h1>
		</header>
		<div class="mui-content">
			
			<div id="XiangQIng" style="padding: 5px; background-color: #ACACB4; border-radius: 30px;">
				
			</div>
			
			<p style="position: relative; top: 2px; color: #000000; font-size: 20px;">评论:</p>
			
			<div id="XIngZheng">
			<p id="XingZhengPingLuen" style="color: #0062CC;">
				新增评论
			</p>
			</div>
			
			<div id="QingLuen" style="background-color: #B6B6B6; padding: 5px; position: relative; border-radius: 50px;">
				
			</div>
			
		</div>
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				var extra = plus.webview.currentWebview().extras || {}

				var id = extra.id || plus.storage.getItem('TiaoZuasId')

					function XinagQing(){

						mui.ajax(http + '/api/community/friendly_neighborhood/' + id,{
							data:{

							},
							headers:{
								'Authorization':localStorage.getItem('token')
							},

							dataType:'json',
							type:'get',
							timeout:10000,
							success:function(data){

								if (data.code == 200) {

									var XiangQingHTML = '';
									XiangQingHTML += `<div style="padding: 5px;">
					<img src="${httpimg + data.data.imgUrl}" style="height: 200px; width: 100%; border-radius: 30px;">
				</div>
				<div style="position: relative;;">
					<h4>${data.data.publishName}</h4>
					<h5 style="color: #000000;">${data.data.publishTime}</h5>
					<h5 style="color: #000000;">${data.data.title}</h5>
					<h5 style="color: #000000;">${data.data.publishContent}</h5>
				</div>`
									document.getElementById('XiangQIng').innerHTML = XiangQingHTML;
								}
							},
							error:function(xhr,type,errorThrown){
								mui.toast('请求失败：' + type)
							}
						});

					}

					XinagQing()

					function PingLuen(){

						mui.ajax(http + '/api/community/friendly_neighborhood/' + id,{
							data:{

							},
							headers:{
								'Authorization':localStorage.getItem('token')
							},

							dataType:'json',
							type:'get',
							timeout:10000,
							success:function(data){

								if (data.code == 200) {

									var PingLuenList = data.data.userComment;
									var WingLuenHTML = '';

									for (var j = 0 ; j < PingLuenList.length ; j++) {
										var c = PingLuenList[j];
									WingLuenHTML += `<div style="border-radius: 30px; background-color: #CCCCCC; margin-bottom: 10px;">

					<div style="padding: 8px; background-color: #8F8F94; border-radius: 35px;">
						<div style="display: flex; align-items: center;">
							<img src="${httpimg + c.avater}" style="height: 24px; width: 24px; border-radius: 50%;">
							<span style="margin-left: 8px; color: #000000;">${c.userName}</span>
						</div>
						<p style="margin: 4px 0; font-size: 12px; color: #333333;">时间:${c.pulishTime}</p>

						<div style="padding: 8px; background-color: #8A6DE9; border-radius: 40px; color: #000000;">
						${c.content}
						</div>

					</div>

				</div>`
									}

									document.getElementById('QingLuen').innerHTML = WingLuenHTML
								}

							},
							error:function(xhr,type,errorThrown){
								mui.toast('请求失败：' + type)
							}
						});

					}
					PingLuen()

					window.addEventListener('refresh', function () {
						PingLuen()
					})

					mui('#XIngZheng').on('tap','#XingZhengPingLuen',function(){

						mui.confirm('你确定新增评论么','新增评论',['取消','确认'],function (e) {

							if (e.index == 1) {

								mui.openWindow({
									url: 'XiangZhengQinglUenHTML.html',
									id: 'XiangZhengQinglUenHTML',
									extras: {
										id: id
									}
								})

							} else{

								mui.toast('你点击了取消')

							}

						},'div')

					})

			})
		</script>
	</body>

</html>
