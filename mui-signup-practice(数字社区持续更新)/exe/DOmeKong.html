		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				function TieZi(){

				mui.ajax(http + '/api/community/friendly_neighborhood/list',{
					data:{

					},
					headers:{
						'Authorization':localStorage.getItem('token')
					},

					dataType:'json',
					type:'GET',
					timeout:10000,
					success:function(data){
						if (data.code == 200) {

							var TieZiList = '';
							for (var i = 0 ; i < data.rows.length ; i++) {
							TieZiList += `<li class="mui-table-view-cell mui-media mui-col-xs-6">
				<a href="#">
				<img src="${data.rows[i].imgUrl}" style="height: 200px; width: 100%;">
				<h5 style="position: relative; left: -20px;">${data.rows[i].title}</h5>
				<img src="${data.rows[i].userImgUrl}" style="height: 20px; width: 20px; position: relative;left: -60px; top: -23px;">

				<h6 style="position: relative; left: 30px;">点赞:${data.rows[i].likeNum}</h6>
				</a>
			</li>`
							}
							document.getElementById('List').innerHTML = TieZiList

						}
					},
					error:function(xhr,type,errorThrown){

					}
				});

				}
				TieZi()
			})
		</script>
	</body>

</html>
