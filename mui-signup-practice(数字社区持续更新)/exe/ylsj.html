<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<h1 class="mui-title">标题</h1>
		</header>
		<div class="mui-content">
			
			<ul class="mui-table-view mui-grid-view mui-grid-9" id="List">
				
				
			
			
				</ul>
			
			
		</div>
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				function TieZi(){

				mui.ajax(http + '/api/community/friendly_neighborhood/list',{
					data:{

					},
					headers:{
						'Authorization':localStorage.getItem('token')
					},

					dataType:'json',
					type:'GET',
					timeout:10000,
					success:function(data){
						if (data.code == 200) {

							var TieZiList = '';
							for (var i = 0 ; i < data.rows.length ; i++) {
							TieZiList += `<li TiaoZuasId="${data.rows[i].id}" class="mui-table-view-cell mui-media mui-col-xs-6">
				<a href="#">
				<img src="${httpimg + data.rows[i].imgUrl}" style="height: 200px; width: 100%;">
				<h5 style="">${data.rows[i].title}</h5>
				<img src="${httpimg + data.rows[i].userImgUrl}" style="height: 20px; width: 20px; position: relative;left: -60px; top: -23px;">

				<h6 style="position: relative; left: 30px;">点赞:${data.rows[i].likeNum}</h6>
				</a>
			</li>`
							}
							document.getElementById('List').innerHTML = TieZiList
							var XiangQingliEThtml = document.querySelectorAll('#List .mui-media')

							for (var j = 0 ; j < XiangQingliEThtml.length ; j++) {

								(function(YeiMian){
									YeiMian.addEventListener('tap',function(){

								var id = this.getAttribute('TiaoZuasId')

								plus.storage.setItem('TiaoZuasId',id)

								mui.openWindow({
									url: 'XiangQingHTML.html',
									id: 'XiangQingHTML',
									extras: {
										id: id
									}
								})

									})
								})(XiangQingliEThtml[j])
							}

						}
					},
					error:function(xhr,type,errorThrown){
						mui.toast('请求失败：' + type)
					}
				});

				}
				TieZi()
			})
		</script>
	</body>

</html>
