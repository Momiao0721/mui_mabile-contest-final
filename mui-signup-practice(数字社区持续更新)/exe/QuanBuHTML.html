<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="../css/mui.css" rel="stylesheet" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left"></a>
			<h1 class="mui-title">公告详情</h1>
		</header>
		
		<div class="mui-content">
			
			<div id="XiagQing" style="padding: 5px; background-color: #ACACB4; border-radius: 30px;">
				
			</div>
			
		</div>
		
		<script src="../js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="../js/http.js"></script>
		<script type="text/javascript">
			mui.init()
			mui.plusReady(function () {

				var extra = plus.webview.currentWebview().extra || {}
				var id = plus.storage.getItem('QuanBuID') || extra.id

				function XiangQing(){

					mui.ajax(http + '/api/community/community_notice/' + id,{
						data:{

						},
						headers:{
							'Authorization':localStorage.getItem('token')
						},

						dataType:'json',
						type:'get',
						timeout:10000,

						success:function(data){
							if (data.code == 200) {

							var XiangIQngHTML = '';
								XiangIQngHTML += `<img src="../IMG/de9509b7ce004.jpg" style="height: 200px; width: 100%; border-radius: 30px;">
				<div id="" style="padding: 5px;">

					<h4>${data.data.noticeTitle}</h4>
					<h5 style="color: #000000;">${data.data.noticeStatus}</h5>
					<h5 style="color: #000000;">${data.data.releaseUnit}</h5>
					<h5 style="color: #000000;">${data.data.contentNotice}</h5>

				</div>`
								document.getElementById('XiagQing').innerHTML = XiangIQngHTML
							}

						},
						error:function(xhr,type,errorThrown){
							mui.toast('请求失败：' + type)
						}
					});

				}
				XiangQing()
			})
		</script>
	</body>

</html>
